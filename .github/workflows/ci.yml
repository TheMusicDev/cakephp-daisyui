name: CI

on:
  push:
  pull_request:

jobs:
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Composer install (prefer-lowest)
        uses: ramsey/composer-install@v4
        with:
          composer-options: '--prefer-lowest --prefer-stable'
      - run: composer test

  test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 'latest'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer cs-check
      - run: composer stan
      - run: composer validate --strict --no-check-publish

  docs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cakephp-daisyui
      - uses: actions/checkout@v7
        with:
          repository: TheMusicDev/cakephp-daisyui-docs
          path: cakephp-daisyui-docs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Point docs at this plugin checkout
        run: |
          cd cakephp-daisyui-docs
          composer install --prefer-dist --no-interaction
          # The docs app requires the released plugin (^1.0); swap in this checkout so the smoke test runs against this push.
          composer config repositories.plugin '{"type": "path", "url": "../cakephp-daisyui", "options": {"symlink": true, "versions": {"themusicdev/cakephp-daisyui": "1.x-dev"}}}'
          composer update themusicdev/cakephp-daisyui --no-interaction
      - run: cd cakephp-daisyui-docs && vendor/bin/phpunit
